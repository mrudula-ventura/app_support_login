<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panic Data Table</title>
    <link rel="stylesheet" href="../static/styles/panic.css">
</head>
<body style="background-image: url('../static/styles/lbg.webp'); background-repeat: no-repeat; background-size: cover; background-attachment: fixed; background-position: center;">

    <div class="navbar">
        <div class="user-info-container">
            <h5>Client ID: <span id="client-id-display"></span></h5> 
            <h5>Full Name: <span id="client-full-name"></span></h5>
            <h5>Email: <span id="client-email"></span></h5>
            <h5>Mobile No: <span id="client-mobile"></span></h5>
        </div>
        <div class="back-btn-container">
          <button class="back-btn" onclick="goBack()">Back</button>
        </div>
    </div>

    <div class="loader-container" id="loader" style="display: none;">
        <div class="loader"></div>
        <p class="loading-text">Loading...</p>
    </div>

    <input type="text" id="searchInput" placeholder="Search module" oninput="filterPanicTable()">

    <div class="no-data-message" id="no-data-message">This user has no panic data.</div>

    <div class="table-container" id="table-container" style="display: none;">
        <table id="panic-table">
            <thead>
                <tr>
                    <th>Device Type</th>
                    <th>Latency</th>
                    <th>Page ID</th>
                    <th>Request Payload</th>
                    <th>Response Code</th>
                    <th>Response Payload</th>
                    <th>Section</th>
                    <th>Timestamp</th>
                    <th>URL</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be dynamically inserted here -->
            </tbody>
        </table>
        <div class="pagination" id="pagination">
            <button id="prevPage" onclick="changePage(-1)">Previous</button>
            
            <button id="nextPage" onclick="changePage(1)">Next</button>
        </div>
    </div>

    <div id="noMatchesMessage" class="noMatchesMessage" style="display: none;">No data found for your search</div>


    <a href="login.html"><button class="lo_btn">Logout</button></a>
    <script src="../static/scripts/panic.js"></script>
</body>
</html>
